# Local one-command dev for the two backend services.
# The frontend runs separately (npm run dev), and the database is Supabase (cloud).
#
#   1) Fill in ../.env  (copy from ../.env.example)
#   2) Set FASTAPI_BASE_URL=http://ai-service:8000 in that .env
#   3) docker compose -f docker/docker-compose.yml up --build
services:
  ai-service:
    build:
      context: ../ai-service
      dockerfile: ../docker/ai-service.Dockerfile
    env_file: ../.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    env_file: ../.env
    environment:
      # Reach the AI service by its compose service name.
      FASTAPI_BASE_URL: http://ai-service:8000
    ports:
      - "8080:8080"
    depends_on:
      - ai-service
    restart: unless-stopped
